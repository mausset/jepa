# @package _global_
encoder:
  arch: convnext-t
  # arch: vit-s
  # patch_size: 12
  # n_registers: 1
  resolution: 96

context: 11

predictor:
  bottleneck: fsq
  arch: vit-s
  fsq_levels: [8,8,8]
  context: ${context}

action_decoder:
  enabled: true
  action_dim: 17
  action_type: discrete
  depth: 2
  heads: 8

data:
  kind: craftax_online
  batch_size: 64
  frame_size: [96, 96]
  include_actions: true

training:
  project: jepa
  seed: 42
  warmup_steps: 1000
  total_steps: 100000
  lambda: 0.1
  sigreg_marginal: shuffled_time
  optimizer: muon
  lr_start: 1e-4
  lr: 3e-4
  cooldown_frac: 0.2
  final_lr_frac: 0.1
  wd: 0.01
  clip_grad: 10.0
  val_fraction: 0.05
  ckpt_fraction: 0.25
  # wandb: disabled
