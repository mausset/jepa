# @package _global_
encoder:
  # arch: convnext-t
  arch: vit-s
  patch_size: 8
  resolution: 96
  n_registers: 1
  dropout: 0.1

context: 7

predictor:
  bottleneck: fsq
  arch: vit-s
  fsq_levels: [8]
  context: ${context}
  dropout: 0.1
  # projector: true
  # projector_norm: bn

action_decoder:
  enabled: true
  action_dim: 7
  action_type: discrete
  depth: 6
  heads: 8
  dropout: 0.1

data:
  kind: toy_env
  train_path: data/toy_envs/keydoor_train.h5
  val_path: data/toy_envs/keydoor_val.h5
  include_actions: true
  batch_size: 128
  num_workers: 8

training:
  project: jepa
  seed: 42
  warmup_steps: 1000
  total_steps: 200000
  lambda: 0.1
  sigreg_marginal: full
  optimizer: muon
  lr_start: 1e-4
  lr: 3e-4
  cooldown_frac: 0.2
  final_lr_frac: 0.1
  wd: 0.01
  clip_grad: 10.0
  val_fraction: 0.05
  ckpt_fraction: 0.25
  # wandb: disabled
