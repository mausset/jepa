# @package _global_
encoder:
  arch: vit-t
  patch_size: 8
  n_registers: 1
  resolution: 96

predictor:
  bottleneck: vae
  arch: vit-s
  latent_dim: 16
  kl_beta: 1.0
  context: 16

action_decoder:
  enabled: true
  action_dim: 2
  action_type: continuous
  depth: 4
  heads: 8

data:
  kind: toy_env
  train_path: data/toy_envs/pointmaze_train.h5
  val_path: data/toy_envs/pointmaze_val.h5
  batch_size: 128
  sequence_length: 16
  include_actions: true
  num_workers: 8

training:
  project: jepa
  seed: 42
  warmup_steps: 1000
  total_steps: 50000
  lambda: 0.1
  sigreg_marginal: full
  optimizer: muon
  lr_start: 1e-4
  lr: 3e-4
  cooldown_frac: 0.2
  final_lr_frac: 0.1
  wd: 0.01
  clip_grad: 10.0
  val_fraction: 0.05
  ckpt_fraction: 0.25
  # wandb: disabled
