seed: 0
output_dir: data/toy_envs
frame_size: [96, 96]

envs:
  pointmaze:
    kind: pointmaze
    env_id: PointMaze_UMaze-v3
    randomize_layout: true
    maze_inner_shape: [4, 4]
    space_frac: [0.5, 0.75]
    min_start_goal_cells: 3
    train_episodes: 10000
    val_episodes: 2000
    max_steps: 100
    action_repeat: 10
    camera:
      lookat: [0.0, 0.0, 0.0]
      distance: 6.5
      elevation: -90
      azimuth: 180
      trackbodyid: -1

  push:
    kind: push
    env_id: FetchPush-v4
    train_episodes: 10000
    val_episodes: 2000
    max_steps: 100
    action_repeat: 5
    frame_size: [224, 224]
    camera:
      lookat: [1.15, 1.01, 1.0]
      distance: 2.1
      elevation: -32
      azimuth: 210

  keydoor:
    kind: keydoor
    env_id: MiniGrid-DoorKey-16x16-v0
    train_episodes: 100000
    val_episodes: 2000
    max_steps: 32
    tile_size: 8

  sokoban:
    kind: sokoban
    env_id: Sokoban-v1
    train_episodes: 20000
    val_episodes: 2000
    max_steps: 32

  pusht:
    kind: pusht
    train_episodes: 10000
    val_episodes: 2000
    max_steps: 100
    max_delta: 0.5

  craftax:
    kind: craftax
    train_episodes: 20000
    val_episodes: 2000
    max_steps: 32
